<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <rect width="240" height="240" rx="52" fill="#FFF7EA"/>
  <!-- paprika tick-seal ring -->
  <circle cx="120" cy="124" r="86" fill="none" stroke="#B3401E" stroke-width="7"/>
  <g stroke="#4C7A3F" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M44 84 q-8 -10 -4 -20"/><path d="M196 84 q8 -10 4 -20"/>
  </g>
  <!-- TRUE MINA (art of record geometry): paprika body, cream face, hand up, feet -->
  <g>
    <ellipse cx="103" cy="196" rx="10" ry="6" fill="#33231C"/>
    <ellipse cx="139" cy="196" rx="10" ry="6" fill="#33231C"/>
    <circle cx="120" cy="138" r="52" fill="#B3401E"/>
    <circle cx="120" cy="132" r="36" fill="#FFF7EA"/>
    <!-- tick hand pointing UP (12 o'clock) + timer marks -->
    <path d="M120 132 L120 106" stroke="#B3401E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="120" cy="132" r="5" fill="#B3401E"/>
    <g stroke="#FFF7EA" stroke-width="5" stroke-linecap="round">
      <path d="M82 108 l6 6"/><path d="M158 108 l-6 6"/><path d="M78 140 l8 0"/>
    </g>
    <!-- dot eyes -->
    <circle cx="108" cy="136" r="4" fill="#33231C"/>
    <circle cx="132" cy="136" r="4" fill="#33231C"/>
    <!-- toque, tilted, paprika outline (her locked final form) -->
    <g transform="rotate(-8 120 74)">
      <path d="M92 84 C 84 62 100 52 108 58 C 112 48 128 48 132 58 C 140 52 156 62 148 84 Z" fill="#FFF7EA" stroke="#B3401E" stroke-width="6"/>
      <path d="M92 84 L148 84 L148 94 L92 94 Z" fill="#FFF7EA" stroke="#B3401E" stroke-width="6"/>
    </g>
  </g>
</svg>
